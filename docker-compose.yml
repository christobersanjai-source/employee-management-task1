services:
  db:
    image: postgres:16
    container_name: employee_db_demo
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: employee_api_demo
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/employee_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
